<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator & Unit Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="tabs">
                <button class="tab-btn active" data-tab="calculator">Calculator</button>
                <button class="tab-btn" data-tab="converter">Converter</button>
            </div>
        </header>

        <main class="app-main">
            <div class="content-wrapper">
                <div class="main-panel">
                    <!-- Calculator Tab -->
                    <section id="calculator" class="tab-content active">
                <div class="calculator-container">
                    <div class="display-container">
                        <div class="expression-display" id="expression-display"></div>
                        <input type="text" class="main-display" id="main-display" value="0" readonly>
                    </div>

                    <div class="keypad">
                        <!-- Controls -->
                        <button class="key control" data-action="clear-entry">CE</button>
                        <button class="key control" data-action="clear-all">C</button>
                        <button class="key control" data-action="backspace">⌫</button>
                        <button class="key operator" data-value="/">/</button>

                        <!-- Scientific Row 1 -->
                        <button class="key sci" data-action="sin">sin</button>
                        <button class="key sci" data-action="cos">cos</button>
                        <button class="key sci" data-action="tan">tan</button>
                        <button class="key operator" data-value="*">*</button>

                        <!-- Scientific Row 2 -->
                        <button class="key sci" data-action="log">log</button>
                        <button class="key sci" data-action="ln">ln</button>
                        <button class="key sci" data-action="sqrt">√</button>
                        <button class="key operator" data-value="-">-</button>

                        <!-- Scientific Row 3 -->
                        <button class="key sci" data-action="pow">x^y</button>
                        <button class="key sci" data-value="(">(</button>
                        <button class="key sci" data-value=")">)</button>
                        <button class="key operator" data-value="+">+</button>

                        <!-- Scientific Row 4 / Numbers -->
                        <button class="key sci" data-value="Math.PI">π</button>
                        <button class="key number" data-value="7">7</button>
                        <button class="key number" data-value="8">8</button>
                        <button class="key number" data-value="9">9</button>

                        <!-- Numbers -->
                        <button class="key sci" data-value="Math.E">e</button>
                        <button class="key number" data-value="4">4</button>
                        <button class="key number" data-value="5">5</button>
                        <button class="key number" data-value="6">6</button>

                        <!-- Numbers & Equals -->
                        <button class="key sci empty"></button>
                        <button class="key number" data-value="1">1</button>
                        <button class="key number" data-value="2">2</button>
                        <button class="key number" data-value="3">3</button>

                        <!-- Bottom Row -->
                        <button class="key sci empty"></button>
                        <button class="key number" data-value="0">0</button>
                        <button class="key number" data-value=".">.</button>
                        <button class="key equals" data-action="calculate">=</button>
                    </div>
                </div>
            </section>

            <!-- Converter Tab -->
            <section id="converter" class="tab-content">
                <div class="converter-container">
                    <div class="converter-group">
                        <label for="conv-category">Category</label>
                        <select id="conv-category" class="conv-select">
                            <option value="length">Length</option>
                            <option value="mass">Weight/Mass</option>
                            <option value="temperature">Temperature</option>
                            <option value="data">Data/Storage</option>
                        </select>
                    </div>

                    <div class="converter-box">
                        <div class="converter-input-group">
                            <input type="number" id="conv-from-val" class="conv-input" value="1">
                            <select id="conv-from-unit" class="conv-select"></select>
                        </div>

                        <div class="converter-swap">
                            <button id="conv-swap-btn">⇅</button>
                        </div>

                        <div class="converter-input-group">
                            <input type="number" id="conv-to-val" class="conv-input" readonly>
                            <select id="conv-to-unit" class="conv-select"></select>
                        </div>
                    </div>
                </div>
            </section>
                </div>

                <!-- History Panel -->
                <aside class="history-panel">
                    <div class="history-header">
                        <h3>History</h3>
                        <button id="clear-history-btn" class="clear-history-btn">Clear</button>
                    </div>
                    <ul id="history-list" class="history-list">
                        <!-- History items will be injected here -->
                    </ul>
                </aside>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
